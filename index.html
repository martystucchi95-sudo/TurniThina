  const c=$('#tc');if(c)c.onclick=()=>{D.tpl=tpl;applyTpl(pl.list);view=new Date(y0,m0,1);sub=null;render();$('#tr').innerHTML='<div>✔ Fatto: giorni inseriti. Puoi correggere le eccezioni toccando il singolo giorno.</div>'};
 };
 $('#tplv').classList.add('show');
}
function openMonthPicker(){
 const dl=$('#dlg');dl.dataset.mode='';let y=view.getFullYear();
 const draw=()=>{
  dl.innerHTML=`<div class="yrow"><button id="yp">‹</button><span>${y}</span><button id="yn">›</button></div>
  <div class="mg">${[...Array(12).keys()].map(i=>`<button data-m="${i}" class="${y===view.getFullYear()&&i===view.getMonth()?'on':''}">${cap(MN(i).slice(0,3))}</button>`).join('')}</div>
  <div class="acts"><button id="mt">Oggi</button></div>`;
  $('#yp').onclick=()=>{y--;draw()};$('#yn').onclick=()=>{y++;draw()};
  dl.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{view=new Date(y,+b.dataset.m,1);sub=null;dl.close();render()});
  $('#mt').onclick=()=>{const n=new Date();view=new Date(n.getFullYear(),n.getMonth(),1);sub=null;dl.close();render()};
 };
 draw();dl.showModal();
}
$('#title').onclick=openMonthPicker;
$('#vm').onclick=()=>{D.vm=D.vm==='d'?'t':'d';save();render()};
render();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
</script></body></html>
